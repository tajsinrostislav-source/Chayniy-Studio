<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chayniy Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

    <!-- Фоновая музыка (Pixabay) -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2a2177ea33.mp3?filename=tender-love-114424.mp3" type="audio/mpeg">
    </audio>
  
<!-- Звуки интерфейса -->
<audio id="sound-click" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<audio id="sound-rare" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3"></audio>
<audio id="sound-title" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
<audio id="sound-cup" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <header class="top-bar">
        <div class="currency-display">
            <span class="icon">🍃</span>
            <span id="leaves-count">0</span>
        </div>
    </header>

    <div class="cup-container" id="cup">
        <div class="steam steam1"></div><div class="steam steam2"></div><div class="steam steam3"></div>
        <div class="cup-body"><div class="cup-handle"></div></div>
        <div class="cup-saucer"></div>
        <div class="shards">
            <div class="shard s1"></div><div class="shard s2"></div>
            <div class="shard s3"></div><div class="shard s4"></div>
        </div>
        <div class="drop-item" id="drop-log">🪵</div>
        <div class="drop-item" id="drop-flower">🌸</div>
        <div class="drop-item" id="drop-tea">☕</div>
        <div class="drop-item" id="drop-kefir">🥛</div>
        <div class="drop-item" id="drop-angel">👼🏻</div>
        <div class="drop-item" id="drop-demon">👹</div>
    </div>

    <h1 class="main-title"><a href="https://t.me/chayniy_studio" target="_blank">chayniy studio</a></h1>

    <!-- Карточки команды -->
    <div class="team-container">
        <div class="member-card" id="member-alkash" style="border: 2px solid #ffb347;">
            <h3 style="margin: 0 0 5px 0; color: #fff;">Chayniy alkash</h3>
            <p style="margin: 0; font-size: 14px; color: #ccc;">Всё и сразу</p>
        </div>
        <div class="member-card" id="member-kefir" style="border: 2px solid #9b59b6;">
            <h3 style="margin: 0 0 5px 0; color: #fff;">Kefir_Kefblch</h3>
            <p style="margin: 0; font-size: 14px; color: #ccc;">Клинер, тайпер</p>
        </div>
        <div class="member-card" id="member-wood" style="border: 2px solid #5d6d7e;">
            <h3 style="margin: 0 0 5px 0; color: #fff;">Woodlander</h3>
            <p style="margin: 0; font-size: 14px; color: #ccc;">Редактор</p>
        </div>
        <div class="member-card" id="member-lutik" style="border: 2px solid #f1c40f;">
            <h3 style="margin: 0 0 5px 0; color: #fff;">Лютик</h3>
            <p style="margin: 0; font-size: 14px; color: #ccc;">Переводчик</p>
        </div>
    </div>

    <div class="shop-buttons">
        <button id="btn-shop-upgrades" class="shop-btn">🛠 Улучшения</button>
        <button id="btn-shop-cosmetics" class="shop-btn">🎨 Косметика</button>
    </div>

    <div class="gacha-container">
        <button id="btn-spin" class="gacha-btn">Крутить (10 🍃)</button>
        <button id="btn-auto-spin" class="gacha-btn" style="display: none; background: #9b59b6; margin-left: 10px;">Авто</button>
        <div id="gacha-result" class="gacha-result-box"></div>
    </div>

    <h2 class="section-title">Коллекция</h2>
    <div id="inventory-container" class="inventory-container"></div>

    <h2 class="section-title">Титулы</h2>
    <div id="titles-container" class="titles-container"></div>

    <div id="modal-overlay" class="modal">
        <div class="modal-content">
            <button class="close-btn" id="modal-close">✖</button>
            <div id="modal-inner-content"></div>
        </div>
    </div>

    <div id="achievement-container"></div>

    <script src="script.js"></script>
</body>
</html>
